name: Fold Metro APK
on:
  push:
    branches: [main, feature/foldable-metro]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - run: chmod +x gradlew
      - run: ./gradlew testFoldableDebugUnitTest assembleFoldableDebug lintFoldableDebug assembleEinkDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fold-Metro-Android
          path: app/build/outputs/apk/foldable/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fold-Metro-validation
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-foldableDebug.html
